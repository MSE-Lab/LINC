[project]
name = "linc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "networkx",
    "typer",
]

[project.scripts]
linc = "linc.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linc*"]
